<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Health Dashboard | EVID-DGC</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive-improvements.css">
    <script src="api-client.js"></script>
    <script src="storage.js"></script>
    <script src="session-manager.js"></script>
    <script src="fixed-navbar.js"></script>
    <style>
        .health-hero {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 40px 0;
            text-align: center;
        }

        .health-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: -30px;
            padding: 0 20px;
        }

        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .metric-card.status-healthy { border-top: 4px solid #22c55e; }
        .metric-card.status-warning { border-top: 4px solid #eab308; }
        .metric-card.status-error { border-top: 4px solid #ef4444; }

        .metric-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-icon {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            color: #475569;
        }

        .metric-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .metric-row:last-child { border-bottom: none; }
        
        .metric-label { color: #64748b; font-weight: 500; }
        .metric-value { color: #0f172a; font-weight: 600; font-family: monospace; font-size: 1.1rem; }

        .alert-card {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
        }
        
        .alert-card.warning { background: #fefce8; border-color: #fef08a; }

        .pulse-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .pulse-healthy { background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover { background: rgba(255, 255, 255, 0.2); }
    </style>

    <script src="device-detector.js"></script>
    <script>if (!DeviceDetector.isDesktopAllowed()) { window.location.href = 'desktop-only.html'; }</script>
</head>
<body>
    <div class="health-hero">
        <div class="container">
            <h1><span class="pulse-indicator pulse-healthy" id="mainStatusPulse"></span> System Health Dashboard</h1>
            <p>Real-time infrastructure monitoring, IPFS node status, and Blockchain sync metrics</p>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 8px;" id="lastUpdated">Loading...</p>
            <button class="refresh-btn" onclick="fetchMetrics()">
                <i data-lucide="refresh-cw" id="refreshIcon"></i> Refresh Metrics
            </button>
        </div>
    </div>

    <div class="container" style="max-width: 1400px; padding-bottom: 60px;">
        <div class="health-grid" id="metricsGrid">
            <!-- Loading State -->
            <div style="grid-column: 1 / -1; text-align: center; padding: 60px;">
                <div class="spinner" style="border: 4px solid #f3f4f6; border-top: 4px solid #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                <p style="margin-top: 20px; color: #64748b;">Establishing connection to telemetry servers...</p>
            </div>
        </div>

        <div class="card" style="margin-top: 30px;">
            <div class="card-header">
                <h2>⚠️ Active System Alerts</h2>
            </div>
            <div class="card-body" id="alertsContainer">
                <p class="text-muted">Loading alerts...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const userAccount = localStorage.getItem('currentUser');
            if (!userAccount) {
                window.location.href = 'index.html';
                return;
            }
            
            // Only Admins should access this normally, but we allow anyone for demo viewing
            
            fetchMetrics();
            // Auto refresh every 30 seconds
            setInterval(fetchMetrics, 30000);
        });

        async function fetchMetrics() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.style.animation = 'spin 1s linear infinite';
            
            try {
                const [metricsRes, alertsRes] = await Promise.all([
                    window.apiClient.get('/monitoring/metrics'),
                    window.apiClient.get('/monitoring/alerts')
                ]);

                if (metricsRes.success) {
                    renderMetrics(metricsRes.metrics);
                    document.getElementById('lastUpdated').textContent = 
                        `Last Updated: ${new Date().toLocaleTimeString()} ${metricsRes.cached ? '(Cached)' : ''}`;
                }

                if (alertsRes.success) {
                    renderAlerts(alertsRes.alerts);
                }

            } catch (error) {
                console.error('Failed to fetch telemetry:', error);
                document.getElementById('mainStatusPulse').className = 'pulse-indicator';
                document.getElementById('mainStatusPulse').style.backgroundColor = '#ef4444';
            } finally {
                refreshIcon.style.animation = 'none';
            }
        }

        function renderMetrics(metrics) {
            const grid = document.getElementById('metricsGrid');
            
            const dbStatusClass = metrics.database.status === 'healthy' ? 'status-healthy' : 'status-error';
            const bcStatusClass = metrics.blockchain.status === 'healthy' ? 'status-healthy' : 'status-error';
            const ipfsStatusClass = metrics.ipfs.status === 'healthy' ? 'status-healthy' : 'status-warning';

            grid.innerHTML = `
                <!-- Database Metrics -->
                <div class="metric-card ${dbStatusClass}">
                    <div class="metric-header">
                        <div class="metric-icon"><i data-lucide="database"></i></div>
                        <div class="metric-title">Supabase Database</div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Status</span>
                        <span class="metric-value" style="color: ${metrics.database.status === 'healthy' ? '#22c55e' : '#ef4444'}">
                            ${metrics.database.status.toUpperCase()}
                        </span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Total Users</span>
                        <span class="metric-value">${metrics.database.totalUsers}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Active Cases</span>
                        <span class="metric-value">${metrics.database.totalCases}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Evidence Items</span>
                        <span class="metric-value">${metrics.database.totalEvidence}</span>
                    </div>
                </div>

                <!-- Blockchain Metrics -->
                <div class="metric-card ${bcStatusClass}">
                    <div class="metric-header">
                        <div class="metric-icon"><i data-lucide="layers"></i></div>
                        <div class="metric-title">Polygon Blockchain</div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Network Sync</span>
                        <span class="metric-value" style="color: ${metrics.blockchain.status === 'healthy' ? '#22c55e' : '#ef4444'}">
                            ${metrics.blockchain.status.toUpperCase()}
                        </span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Current Block</span>
                        <span class="metric-value">#${metrics.blockchain.currentBlock}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Items On-Chain</span>
                        <span class="metric-value">${metrics.blockchain.totalEvidenceOnChain}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Wallet Balance</span>
                        <span class="metric-value">${metrics.blockchain.walletBalance} MATIC</span>
                    </div>
                </div>

                <!-- IPFS Metrics -->
                <div class="metric-card ${ipfsStatusClass}">
                    <div class="metric-header">
                        <div class="metric-icon"><i data-lucide="hard-drive"></i></div>
                        <div class="metric-title">IPFS Node (Pinata)</div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Node Connection</span>
                        <span class="metric-value" style="color: ${metrics.ipfs.status === 'healthy' ? '#22c55e' : '#eab308'}">
                            ${metrics.ipfs.status.toUpperCase()}
                        </span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Pinned Files</span>
                        <span class="metric-value">${metrics.ipfs.totalFiles}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Total Storage</span>
                        <span class="metric-value">${metrics.ipfs.totalStorageMB} MB</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Gateway Status</span>
                        <span class="metric-value" style="color: #22c55e">ONLINE</span>
                    </div>
                </div>

                <!-- Performance Metrics -->
                <div class="metric-card status-healthy">
                    <div class="metric-header">
                        <div class="metric-icon"><i data-lucide="activity"></i></div>
                        <div class="metric-title">Server Performance</div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Server Uptime</span>
                        <span class="metric-value">${Math.floor(metrics.performance.uptime / 3600)}h ${Math.floor((metrics.performance.uptime % 3600) / 60)}m</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Memory Usage</span>
                        <span class="metric-value">${metrics.performance.memoryUsage.heapUsed}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Uploads (24h)</span>
                        <span class="metric-value">${metrics.performance.uploadsLast24h}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Verifications (24h)</span>
                        <span class="metric-value">${metrics.performance.verificationsLast24h}</span>
                    </div>
                </div>
            `;
            
            lucide.createIcons();
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            
            if (!alerts || alerts.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 30px; color: #22c55e;">
                        <i data-lucide="check-circle" style="width: 48px; height: 48px; margin-bottom: 12px;"></i>
                        <h3>All Systems Operational</h3>
                        <p>No active alerts or warnings across the infrastructure.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = alerts.map(alert => `
                <div class="alert-card ${alert.severity === 'warning' ? 'warning' : ''}">
                    <i data-lucide="alert-triangle" style="color: ${alert.severity === 'warning' ? '#ca8a04' : '#dc2626'}"></i>
                    <div>
                        <h4 style="margin: 0 0 4px 0; color: #1e293b;">${alert.message}</h4>
                        <p style="margin: 0; font-size: 0.9rem; color: #64748b;">${alert.action || alert.error || 'System attention required.'}</p>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }
    </script>
</body>
</html>
