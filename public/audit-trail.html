<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Audit Trail | EVID-DGC</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive-improvements.css">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KEYDE0ZH4Z"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-KEYDE0ZH4Z');
    </script>

    <script src="device-detector.js"></script>
    <script>if (!DeviceDetector.isDesktopAllowed()) { window.location.replace('desktop-only.html'); }</script>
</head>

<body>
    <nav class="dashboard-nav">
        <div class="container">
            <div class="nav-content">
                <a href="index.html" class="nav-brand">🔐 EVID-DGC</a>
                <div class="nav-items">
                    <span id="userRole" class="badge">Loading...</span>
                    <span id="userWallet" class="wallet-display">Loading...</span>
                    <button class="btn btn-outline btn-sm" onclick="logout()">🚪 Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Audit Controls -->
        <div class="card">
            <div class="card-header">
                <h2>🔍 Audit Trail Filters</h2>
            </div>
            <div class="card-body">
                <div class="filter-row">
                    <div class="form-group">
                        <label for="filterUser">👤 User</label>
                        <select id="filterUser" class="form-control">
                            <option value="">All Users</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filterAction">⚡ Action</label>
                        <select id="filterAction" class="form-control">
                            <option value="">All Actions</option>
                            <option value="evidence_upload">Evidence Upload</option>
                            <option value="evidence_view">Evidence View</option>
                            <option value="evidence_seal">Evidence Seal</option>
                            <option value="user_login">User Login</option>
                            <option value="user_create">User Create</option>
                            <option value="hash_verify">Hash Verify</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filterDateFrom">📅 From Date</label>
                        <input type="date" id="filterDateFrom" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="filterDateTo">📅 To Date</label>
                        <input type="date" id="filterDateTo" class="form-control">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" onclick="applyFilters()">🔍 Apply Filters</button>
                        <button class="btn btn-outline" onclick="exportAuditLog()">📄 Export CSV</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Audit Log -->
        <div class="card">
            <div class="card-header">
                <h2>📋 System Activity Log</h2>
                <div class="card-actions">
                    <span id="logCount" class="text-muted">Loading...</span>
                    <button class="btn btn-outline btn-sm" onclick="refreshAuditLog()">🔄 Refresh</button>
                </div>
            </div>
            <div class="card-body">
                <div id="auditLogContainer" class="audit-log">
                    <div class="text-center p-4">
                        <div class="loading mb-4"></div>
                        <p>Loading audit trail...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Blockchain Verification -->
        <div class="card">
            <div class="card-header">
                <h2>⛓️ Blockchain Verification</h2>
            </div>
            <div class="card-body">
                <div class="verification-tools">
                    <div class="form-group">
                        <label for="hashInput">🔐 Verify Evidence Hash</label>
                        <div class="input-group">
                            <input type="text" id="hashInput" class="form-control"
                                placeholder="Enter SHA-256 hash to verify">
                            <button class="btn btn-primary" onclick="verifyEvidenceHash()">🔍 Verify</button>
                        </div>
                    </div>
                    <div id="verificationResult" class="verification-result"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>
    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="api-client.js"></script>
    <script>
        let currentUser = null;
        let auditLog = [];
        let filteredLog = [];

        document.addEventListener('DOMContentLoaded', async function () {
            await initializeAuditTrail();
        });

        async function initializeAuditTrail() {
            try {
                // Use unified apiClient to get current user
                currentUser = await window.apiClient.getCurrentUser();
                
                if (!currentUser) {
                    window.location.href = 'index.html';
                    return;
                }

                // Check if user has audit permissions
                if (!hasAuditPermissions(currentUser.role)) {
                    alert('Access denied. Audit permissions required.');
                    window.location.href = 'dashboard.html';
                    return;
                }

                updateUserUI(currentUser);
                await loadAuditLog();

                // Set default date range (last 30 days)
                const today = new Date();
                const thirtyDaysAgo = new Date(today.getTime() - (30 * 24 * 60 * 60 * 1000));
                document.getElementById('filterDateFrom').value = thirtyDaysAgo.toISOString().split('T')[0];
                document.getElementById('filterDateTo').value = today.toISOString().split('T')[0];

            } catch (error) {
                console.error('Initialization error:', error);
                showAlert('Failed to initialize audit trail: ' + error.message, 'error');
            }
        }

        function hasAuditPermissions(role) {
            const auditRoles = ['auditor', 'admin', 'legal_professional', 7, 8, 4];
            return auditRoles.includes(role);
        }

        function updateUserUI(user) {
            const roleName = getRoleName(user.role);
            const userRoleEl = document.getElementById('userRole');
            const userWalletEl = document.getElementById('userWallet');
            
            if (userRoleEl) {
                userRoleEl.textContent = roleName;
                userRoleEl.className = `badge badge-${getRoleClass(user.role)}`;
            }
            if (userWalletEl) {
                userWalletEl.textContent = user.wallet_address.substring(0, 8) + '...';
            }
        }

        async function loadAuditLog(filters = {}) {
            try {
                const container = document.getElementById('auditLogContainer');
                container.innerHTML = '<div class="text-center p-4"><div class="loading mb-4"></div><p>Syncing with blockchain audit logs...</p></div>';

                const result = await window.apiClient.get('/admin/activity-logs', filters);
                
                if (result.success) {
                    auditLog = result.logs || [];
                    filteredLog = [...auditLog];
                    renderAuditLog(filteredLog);
                    document.getElementById('logCount').textContent = `${filteredLog.length} entries`;
                    
                    if (Object.keys(filters).length === 0) {
                        await populateUserFilter();
                    }
                } else {
                    throw new Error(result.error || 'Failed to fetch logs');
                }
            } catch (error) {
                console.error('Error loading audit log:', error);
                document.getElementById('auditLogContainer').innerHTML = `<p class="text-center text-danger">Error loading audit log: ${error.message}</p>`;
            }
        }

        function renderAuditLog(logs) {
            const container = document.getElementById('auditLogContainer');

            if (logs.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">No audit entries found in database</p>';
                return;
            }

            const logHtml = logs.map(entry => `
                <div class="audit-entry ${entry.is_success !== false ? 'success' : 'failed'}">
                    <div class="audit-header">
                        <div class="audit-action">
                            <span class="action-icon">${getActionIcon(entry.action_type)}</span>
                            <span class="action-name">${formatActionName(entry.action_type)}</span>
                            <span class="audit-status ${entry.is_success !== false ? 'success' : 'failed'}">
                                ${entry.is_success !== false ? '✅' : '❌'}
                            </span>
                        </div>
                        <div class="audit-time">${formatTimestamp(entry.created_at)}</div>
                    </div>
                    <div class="audit-details">
                        <p><strong>User:</strong> ${entry.user_wallet.substring(0, 10)}... (${entry.users?.full_name || 'System'})</p>
                        <p><strong>Action:</strong> ${entry.details || 'N/A'}</p>
                        <p><strong>Resource:</strong> ${entry.resource_type} (${entry.resource_id || 'Global'})</p>
                        ${entry.blockchain_tx ? `<p><strong>Blockchain TX:</strong> <a href="https://amoy.polygonscan.com/tx/${entry.blockchain_tx}" target="_blank"><code>${entry.blockchain_tx.substring(0, 20)}...</code></a></p>` : ''}
                    </div>
                </div>
            `).join('');

            container.innerHTML = logHtml;
        }

        function getActionIcon(action) {
            const icons = {
                'CREATE': '➕',
                'UPDATE': '📝',
                'DELETE': '🗑️',
                'VIEW': '👁️',
                'LOGIN': '🔑',
                'VERIFY': '🔍',
                'SEAL': '🔒',
                'UPLOAD': '📤'
            };
            return icons[action] || '⚡';
        }

        function formatActionName(action) {
            return action.charAt(0) + action.slice(1).toLowerCase();
        }

        function formatTimestamp(timestamp) {
            return new Date(timestamp).toLocaleString();
        }

        async function populateUserFilter() {
            const userSelect = document.getElementById('filterUser');
            if (!userSelect) return;
            
            const uniqueUsers = [...new Set(auditLog.map(entry => entry.user_wallet))];
            
            // Keep "All Users"
            userSelect.innerHTML = '<option value="">All Users</option>';

            uniqueUsers.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user.substring(0, 12) + '...';
                userSelect.appendChild(option);
            });
        }

        async function applyFilters() {
            const filters = {
                userWallet: document.getElementById('filterUser').value,
                actionType: document.getElementById('filterAction').value,
                dateFrom: document.getElementById('filterDateFrom').value,
                dateTo: document.getElementById('filterDateTo').value
            };

            await loadAuditLog(filters);
        }

        function refreshAuditLog() {
            applyFilters();
        }

        async function exportAuditLog() {
            try {
                const filters = {
                    userWallet: document.getElementById('filterUser').value,
                    actionType: document.getElementById('filterAction').value,
                    dateFrom: document.getElementById('filterDateFrom').value,
                    dateTo: document.getElementById('filterDateTo').value,
                    export: 'true'
                };
                
                const signedHeaders = await window.apiClient.getAuthHeaders();
                const params = new URLSearchParams(filters);
                const response = await fetch(`${window.config.API_BASE_URL}/admin/activity-logs/export?${params}`, {
                    headers: signedHeaders
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `audit_log_${new Date().toISOString().split('T')[0]}.csv`;
                    a.click();
                    showAlert('Audit log exported successfully', 'success');
                } else {
                    throw new Error('Export failed');
                }
            } catch (error) {
                showAlert('Export failed: ' + error.message, 'error');
            }
        }

        async function verifyEvidenceHash() {
            const hash = document.getElementById('hashInput').value.trim();
            const resultDiv = document.getElementById('verificationResult');

            if (!hash) {
                showAlert('Please enter a hash to verify', 'error');
                return;
            }

            try {
                resultDiv.innerHTML = '<div class="text-center p-3">Checking blockchain records...</div>';
                
                const result = await window.apiClient.post('/evidence/verify-integrity', {
                    calculatedHash: hash
                });

                if (result.success && result.verified) {
                    resultDiv.innerHTML = `
                        <div class="verification-success">
                            <h4>✅ Hash Verified on Blockchain</h4>
                            <p><strong>Evidence ID:</strong> ${result.evidence?.id || 'N/A'}</p>
                            <p><strong>Status:</strong> Immutable record found</p>
                            <p><strong>Blockchain TX:</strong> ${result.blockchainTx?.substring(0, 20)}...</p>
                            <p><strong>Verification Time:</strong> ${new Date().toLocaleString()}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="verification-failed">
                            <h4>❌ Verification Failed</h4>
                            <p>This hash does not match any immutable blockchain records.</p>
                            <p><strong>Reason:</strong> ${result.error || 'Record not found'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Verification error:', error);
                showAlert('Verification failed: ' + error.message, 'error');
            }
        }

        function getRoleName(role) {
            const roleMap = {
                'public_viewer': 'Public Viewer', 'investigator': 'Investigator',
                'forensic_analyst': 'Forensic Analyst', 'legal_professional': 'Legal Professional',
                'court_official': 'Court Official', 'evidence_manager': 'Evidence Manager',
                'auditor': 'Auditor', 'admin': 'Administrator',
                1: 'Public Viewer', 2: 'Investigator', 3: 'Forensic Analyst',
                4: 'Legal Professional', 5: 'Court Official', 6: 'Evidence Manager',
                7: 'Auditor', 8: 'Administrator'
            };
            return roleMap[role] || 'Unknown';
        }

        function getRoleClass(role) {
            const classes = {
                'public_viewer': 'public', 'investigator': 'investigator', 'forensic_analyst': 'forensic',
                'legal_professional': 'legal', 'court_official': 'court', 'evidence_manager': 'manager',
                'auditor': 'auditor', 'admin': 'admin',
                1: 'public', 2: 'investigator', 3: 'forensic', 4: 'legal',
                5: 'court', 6: 'manager', 7: 'auditor', 8: 'admin'
            };
            return classes[role] || 'public';
        }

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = message;
            alert.style.cssText = `
                position: fixed; top: 20px; right: 20px; z-index: 1000;
                padding: 12px 20px; border-radius: 8px; color: white; font-weight: 500;
                max-width: 400px; background: ${type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#17a2b8'};
            `;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>

    <style>
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 20px;
            align-items: end;
        }

        @media (max-width: 900px) {
            .filter-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .filter-row {
                grid-template-columns: 1fr;
            }
        }

        .audit-log {
            max-height: 600px;
            overflow-y: auto;
        }

        .audit-entry {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
        }

        .audit-entry.failed {
            border-left: 4px solid #dc3545;
        }

        .audit-entry.success {
            border-left: 4px solid #28a745;
        }

        .audit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .audit-action {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-icon {
            font-size: 1.2rem;
        }

        .action-name {
            font-weight: 600;
        }

        .audit-status.success {
            color: #28a745;
        }

        .audit-status.failed {
            color: #dc3545;
        }

        .audit-time {
            color: #666;
            font-size: 0.9rem;
        }

        .audit-details p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .verification-tools {
            max-width: 600px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
        }

        .verification-result {
            margin-top: 20px;
        }

        .verification-success {
            padding: 20px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            color: #155724;
        }

        .verification-failed {
            padding: 20px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            color: #721c24;
        }
    </style>
    <script src="footer.js"></script>
</body>

</html>
