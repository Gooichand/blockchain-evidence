<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 40" width="660" height="40">
  <defs>
    <linearGradient id="statusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e14"/>
      <stop offset="100%" style="stop-color:#141c24"/>
    </linearGradient>
    <filter id="statusGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    <!-- Build Status -->
    <g transform="translate(10, 5)">
      <rect width="145" height="30" rx="6" fill="url(#statusBg)" stroke="#00FF88" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="15" cy="20" r="5" fill="#00FF88">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="21" fill="#00FF88" filter="url(#statusGlow)">Build: Passing</text>
    </g>

    <!-- Deploy Status -->
    <g transform="translate(170, 5)">
      <rect width="140" height="30" rx="6" fill="url(#statusBg)" stroke="#dc2626" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="25" cy="20" r="5" fill="#dc2626">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <text x="45" y="21" fill="#f87171" filter="url(#statusGlow)">Deploy: Live</text>
    </g>

    <!-- Contract Verified -->
    <g transform="translate(325, 5)">
      <rect width="165" height="30" rx="6" fill="url(#statusBg)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="15" cy="20" r="5" fill="#ef4444">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <text x="35" y="21" fill="#fca5a5" filter="url(#statusGlow)">Contract: Verified</text>
    </g>

    <!-- Tests Passing -->
    <g transform="translate(505, 5)">
      <rect width="145" height="30" rx="6" fill="url(#statusBg)" stroke="#f87171" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="15" cy="20" r="5" fill="#f87171">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <text x="35" y="21" fill="#fca5a5" filter="url(#statusGlow)">Tests: 16/16</text>
    </g>
  </g>
</svg>