<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 40" width="600" height="40">
  <defs>
    <linearGradient id="statusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <filter id="statusGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    <!-- Build Status -->
    <g transform="translate(10, 5)">
      <rect width="140" height="30" rx="6" fill="url(#statusBg)" stroke="#00FF88" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="15" cy="20" r="5" fill="#00FF88">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="21" fill="#00FF88" filter="url(#statusGlow)">Build: Passing</text>
    </g>
    
    <!-- Deploy Status -->
    <g transform="translate(160, 5)">
      <rect width="140" height="30" rx="6" fill="url(#statusBg)" stroke="#36BCF7" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="15" cy="20" r="5" fill="#36BCF7">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <text x="35" y="21" fill="#36BCF7" filter="url(#statusGlow)">Deploy: Live</text>
    </g>
    
    <!-- Contract Verified -->
    <g transform="translate(310, 5)">
      <rect width="160" height="30" rx="6" fill="url(#statusBg)" stroke="#8247E5" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="15" cy="20" r="5" fill="#8247E5">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <text x="35" y="21" fill="#8247E5" filter="url(#statusGlow)">Contract: Verified</text>
    </g>
    
    <!-- Tests Passing -->
    <g transform="translate(480, 5)">
      <rect width="110" height="30" rx="6" fill="url(#statusBg)" stroke="#FFB800" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="15" cy="20" r="5" fill="#FFB800">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <text x="35" y="21" fill="#FFB800" filter="url(#statusGlow)">Tests: 94%</text>
    </g>
  </g>
</svg>