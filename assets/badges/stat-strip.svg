<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="Project metrics">
<title>Project metrics</title>
<defs>
  <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#08090b"/>
    <stop offset="60%"  stop-color="#0c0d11"/>
    <stop offset="100%" stop-color="#08090b"/>
  </linearGradient>
  <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#e5484d" stop-opacity="0"/>
    <stop offset="45%"  stop-color="#e5484d" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#e5484d" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity=".10"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity=".02"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0%"   stop-color="#e5484d" stop-opacity=".26"/>
    <stop offset="55%"  stop-color="#e5484d" stop-opacity=".05"/>
    <stop offset="100%" stop-color="#e5484d" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <filter id="softer" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  
</defs>
<rect width="1200" height="108" fill="#08090b"/>
  <g>
    <line x1="0" y1="30" x2="282" y2="30" stroke="#ffffff" stroke-opacity=".14" stroke-width="1"/>
    <text x="0" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700"
          fill="#f2f3f5" letter-spacing="-1">128</text>
    <text x="2" y="90" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#8b909a"
          letter-spacing="1.4">REST ENDPOINTS</text>
    <circle cx="278" cy="34" r="2.5" fill="#f2f3f5">
      <animate attributeName="opacity" values=".3;1;.3" dur="3.4s"
               begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="306" y1="30" x2="588" y2="30" stroke="#ffffff" stroke-opacity=".14" stroke-width="1"/>
    <text x="306" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700"
          fill="#f2f3f5" letter-spacing="-1">8</text>
    <text x="308" y="90" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#8b909a"
          letter-spacing="1.4">ACCESS ROLES</text>
    <circle cx="584" cy="34" r="2.5" fill="#f2f3f5">
      <animate attributeName="opacity" values=".3;1;.3" dur="3.9s"
               begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="612" y1="30" x2="894" y2="30" stroke="#ffffff" stroke-opacity=".14" stroke-width="1"/>
    <text x="612" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700"
          fill="#f2f3f5" letter-spacing="-1">17</text>
    <text x="614" y="90" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#8b909a"
          letter-spacing="1.4">AUTOMATED TESTS</text>
    <circle cx="890" cy="34" r="2.5" fill="#f2f3f5">
      <animate attributeName="opacity" values=".3;1;.3" dur="4.4s"
               begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="918" y1="30" x2="1200" y2="30" stroke="#ffffff" stroke-opacity=".14" stroke-width="1"/>
    <text x="918" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700"
          fill="#e5484d" letter-spacing="-1">1</text>
    <text x="920" y="90" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#8b909a"
          letter-spacing="1.4">ANCHORED DIGEST</text>
    <circle cx="1196" cy="34" r="2.5" fill="#e5484d">
      <animate attributeName="opacity" values=".3;1;.3" dur="4.9s"
               begin="1.2000000000000002s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
