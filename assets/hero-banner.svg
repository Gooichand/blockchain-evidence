<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Gradient Definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e14"/>
      <stop offset="50%" style="stop-color:#181c24"/>
      <stop offset="100%" style="stop-color:#0f1117"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="40%" style="stop-color:#f87171"/>
      <stop offset="70%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>

    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.35"/>
      <stop offset="70%" style="stop-color:#dc2626;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#dc2626" flood-opacity="0.8" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave Pattern -->
    <pattern id="wavePattern" x="0" y="0" width="1200" height="320" patternUnits="userSpaceOnUse">
      <path d="M0,160 Q300,110 600,160 T1200,160" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.18">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="M0,160 Q300,110 600,160 T1200,160;
                  M0,160 Q300,190 600,160 T1200,160;
                  M0,160 Q300,110 600,160 T1200,160"/>
      </path>
      <path d="M0,190 Q300,140 600,190 T1200,190" fill="none" stroke="#f87171" stroke-width="0.5" opacity="0.12">
        <animate attributeName="d" dur="10s" repeatCount="indefinite"
          values="M0,190 Q300,140 600,190 T1200,190;
                  M0,190 Q300,220 600,190 T1200,190;
                  M0,190 Q300,140 600,190 T1200,190"/>
      </path>
    </pattern>

    <!-- Circuit Pattern -->
    <pattern id="circuitPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="60" height="60" fill="none"/>
      <path d="M0,30 L60,30 M30,0 L30,60" stroke="#dc2626" stroke-width="0.3" opacity="0.09"/>
      <circle cx="30" cy="30" r="3" fill="#dc2626" opacity="0.15"/>
      <circle cx="0" cy="0" r="1.5" fill="#dc2626" opacity="0.1"/>
      <circle cx="60" cy="0" r="1.5" fill="#dc2626" opacity="0.1"/>
      <circle cx="0" cy="60" r="1.5" fill="#dc2626" opacity="0.1"/>
      <circle cx="60" cy="60" r="1.5" fill="#dc2626" opacity="0.1"/>
    </pattern>

    <!-- Blockchain cube symbol -->
    <g id="cube">
      <path d="M0,0 L20,-12 L40,0 L40,20 L20,32 L0,20 Z" fill="#dc2626" fill-opacity="0.9"/>
      <path d="M20,-12 L40,0 L40,20 L20,32" fill="none" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.8"/>
      <path d="M0,0 L20,-12 L40,0 L20,12 Z" fill="#f87171" fill-opacity="0.5"/>
      <path d="M0,0 L20,12 L20,32 L0,20 Z" fill="#991b1b" fill-opacity="0.7"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" fill="url(#circuitPattern)"/>
  <rect width="1200" height="320" fill="url(#wavePattern)"/>

  <!-- Glow Orbs -->
  <circle cx="200" cy="110" r="160" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="r" values="160;190;160" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.55;0.35" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="210" r="130" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="r" values="130;160;130" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="60" r="110" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="r" values="110;140;110" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Particle System -->
  <circle r="2" fill="#dc2626" opacity="0.8">
    <animateMotion path="M50,260 Q200,60 400,210 Q600,310 800,110 Q1000,260 1150,160" dur="15s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;3;1" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#f87171" opacity="0.6">
    <animateMotion path="M100,60 Q300,260 500,120 Q700,60 900,220 Q1100,120 1200,300" dur="18s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#ef4444" opacity="0.7">
    <animateMotion path="M200,290 Q400,90 600,270 Q800,60 1000,250" dur="12s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;4;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#991b1b" opacity="0.5">
    <animateMotion path="M50,120 Q250,290 450,90 Q650,320 850,140 Q1050,290 1200,110" dur="20s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated rotating blockchain cubes -->
  <g transform="translate(95, 160) scale(1.4)">
    <use href="#blocks">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.5s" repeatCount="indefinite"/>
    </use>
    <use href="#blocks" transform="translate(28, 0)" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="28,0;28,-14;28,0" dur="3.5s" repeatCount="indefinite" begin="0.35s"/>
    </use>
    <use href="#blocks" transform="translate(56, 0)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="56,0;56,-14;56,0" dur="3.5s" repeatCount="indefinite" begin="0.7s"/>
    </use>
  </g>

  <g transform="translate(1035, 150) scale(1.1)">
    <use href="#blocks">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4s" repeatCount="indefinite"/>
    </use>
    <use href="#blocks" transform="translate(55, 0)" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="55,0;55,-12;55,0" dur="4s" repeatCount="indefinite" begin="0.4s"/>
    </use>
    <use href="#blocks" transform="translate(110, 0)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="110,0;110,-12;110,0" dur="4s" repeatCount="indefinite" begin="0.8s"/>
    </use>
  </g>

  <!-- Main Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace">
    <!-- Badge -->
    <g transform="translate(600, 45)">
      <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="600" fill="#f87171" letter-spacing="1.5" style="text-transform:uppercase">Blockchain Evidence System</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="140" text-anchor="middle" font-size="52" font-weight="800" fill="url(#textGradient)" filter="url(#textGlow)" letter-spacing="-1">
      EVID-DGC
    </text>

    <!-- Subtitle -->
    <text x="600" y="192" text-anchor="middle" font-size="18" font-weight="400" fill="#A0B8D8" letter-spacing="0.5">
      Secure Blockchain Evidence Management
    </text>

    <!-- Tagline -->
    <text x="600" y="222" text-anchor="middle" font-size="14" font-weight="500" fill="#f87171" opacity="0.9" letter-spacing="2" style="text-transform:uppercase">
      Immutable • Verifiable • Court-Ready
    </text>

    <!-- Status Indicators -->
    <g transform="translate(600, 262)">
      <g transform="translate(-190, 0)">
        <circle r="6" fill="#00FF88" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="14" y="5" font-size="11" fill="#88D8B0" font-weight="500">Core System ✓</text>
      </g>
      <g transform="translate(-20, 0)">
        <circle r="6" fill="#00FF88" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
        </circle>
        <text x="14" y="5" font-size="11" fill="#88D8B0" font-weight="500">Blockchain+IPFS ✓</text>
      </g>
      <g transform="translate(160, 0)">
        <circle r="6" fill="#dc2626" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="14" y="5" font-size="11" fill="#FCA5A5" font-weight="500">AI Forensics 🔄</text>
      </g>
    </g>
  </g>

  <!-- Decorative Elements -->
  <!-- Top Accent Line -->
  <line x1="300" y1="30" x2="900" y2="30" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;600" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="200,400;400,200" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom Accent Line -->
  <line x1="300" y1="290" x2="900" y2="290" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="600;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="400,200;200,400" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Corner Accents -->
  <g stroke="#dc2626" stroke-width="2" opacity="0.5">
    <path d="M50,50 L100,50 M50,50 L50,100">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="50,50;0,100" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1150,50 L1100,50 M1150,50 L1150,100">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="50,50;0,100" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M50,270 L100,270 M50,270 L50,220">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="50,50;0,100" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1150,270 L1100,270 M1150,270 L1150,220">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="50,50;0,100" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating Geometric Shapes -->
  <g opacity="0.15">
    <polygon points="600,20 590,45 615,40 610,65 590,60 600,85 590,60 585,65 580,40 605,45" fill="#dc2626">
      <animateTransform attributeName="transform" type="rotate" from="0 600 50" to="360 600 50" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="150,110 145,125 158,122 155,138 142,132 150,148 142,132 138,138 135,122 148,125" fill="#ef4444">
      <animateTransform attributeName="transform" type="rotate" from="0 150 130" to="-360 150 130" dur="15s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="1050,190 1045,205 1058,202 1055,218 1042,212 1050,228 1042,212 1038,218 1035,202 1048,205" fill="#f87171">
      <animateTransform attributeName="transform" type="rotate" from="0 1050 210" to="360 1050 210" dur="18s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>